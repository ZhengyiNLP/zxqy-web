[project]
name = "backend"
version = "1.0.0"
description = "FastAPI + Vue3 Template Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.1",
    "fastapi>=0.115.0",
    "markdown>=3.7",
    "pydantic>=2.9.2",
    "python-jose[cryptography]>=3.3.0",
    "python-multipart>=0.0.12",
    "pymysql>=1.1.0",
    "sqlalchemy>=2.0.35",
    "uvicorn[standard]>=0.30.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
